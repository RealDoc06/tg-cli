# The landing page at https://tg-cli.realdoc06.it: the static files in public/,
# served by Caddy. Nexora terminates TLS and reaches the container as
# tg-cli-site:8080 on the proxy network.
#
# Deploy from the repository root:
#   tar -C site -c . | ssh <host> 'mkdir -p tg-cli-site && tar -C tg-cli-site -x'
#   ssh <host> docker compose -f tg-cli-site/compose.yml up -d
# public/ is mounted, so copying the files again is enough to update the live page.
services:
  site:
    image: caddy:2-alpine
    container_name: tg-cli-site
    restart: unless-stopped
    command: caddy file-server --root /srv --listen :8080
    volumes:
      - ./public:/srv:ro
    read_only: true
    tmpfs: [/config, /data]
    cap_drop: [ALL]
    # The image's caddy binary carries this file capability and will not start without it.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    networks: [proxy]

networks:
  proxy:
    external: true
    name: network-tools_proxy
