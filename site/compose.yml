# The landing page at https://tgc.li: the static files in public/, served by
# Caddy with the Caddyfile next to this file. Nexora terminates TLS and reaches
# the container as tg-cli-site:8080 on the proxy network.
#
# Deploy from the repository root:
#   tar -C site -c . | ssh <host> 'mkdir -p tg-cli-site && tar -C tg-cli-site -x'
#   ssh <host> docker compose -f tg-cli-site/compose.yml up -d
# public/ is mounted, so copying the files again is enough to update the live
# page. After a change to the Caddyfile, add --force-recreate to the second command.
services:
  site:
    image: caddy:2-alpine
    container_name: tg-cli-site
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv:ro
    read_only: true
    tmpfs: [/config, /data]
    cap_drop: [ALL]
    # The image's caddy binary carries this file capability and will not start without it.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    networks: [proxy]

networks:
  proxy:
    external: true
    name: network-tools_proxy
